<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Sukses — Habit Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --gold:#D4A64A;
  --gold-deep:#A67C2E;
  --teal:#4C7B72;
  --teal-deep:#33564F;
  --wine:#8B3A3A;

  --bg-page:#F6F0E2;
  --bg-card:#FCF9F1;
  --bg-card-alt:#EBE1C8;
  --text-primary:#101B30;
  --text-secondary:#5B5F6B;
  --border:rgba(29,53,87,0.16);
  --shadow: 0 8px 22px rgba(16,27,48,0.09);
  --overlay-bg: rgba(16,27,48,0.55);
  --radius: 12px;
}
:root[data-theme="dark"]{
  --gold:#E3B85C;
  --gold-deep:#C99A44;
  --teal:#5FA096;
  --teal-deep:#4A8079;
  --wine:#D07A7A;

  --bg-page:#0F1826;
  --bg-card:#16223A;
  --bg-card-alt:#1E2C48;
  --text-primary:#F1ECDC;
  --text-secondary:#9BA6BF;
  --border:rgba(255,255,255,0.12);
  --shadow: 0 8px 22px rgba(0,0,0,0.4);
  --overlay-bg: rgba(0,0,0,0.65);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-page);
  color:var(--text-primary);
  font-family:'Montserrat',sans-serif;
  min-height:100vh;
  transition: background-color .2s ease, color .2s ease;
}
.mono{font-family:'JetBrains Mono',monospace;}
#app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Header ---------- */
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:28px;flex-wrap:wrap;
}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:50px;height:50px;border-radius:50%;
  background: var(--gold);
  border:2px solid var(--gold-deep);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:24px;height:24px;}
.brand-text h1{margin:0;font-size:19px;font-weight:800;color:var(--text-primary);letter-spacing:0.2px;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--text-secondary);font-weight:500;}
.btn{
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:13.5px;
  border:none;border-radius:9px;cursor:pointer;padding:12px 18px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, background .12s ease, border-color .12s ease;
  letter-spacing:0.2px;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--gold);color:#191100;}
.btn-primary:hover{background:var(--gold-deep);color:#fff;}
.btn-outline{background:transparent;color:var(--text-primary);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--gold-deep);}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:8px 10px;}
.btn-ghost:hover{color:var(--wine);}
.btn-icon{width:42px;height:42px;padding:0;justify-content:center;border-radius:9px;background:transparent;border:1.5px solid var(--border);color:var(--text-primary);font-size:17px;}
.btn-icon:hover{border-color:var(--gold-deep);}
.btn-sm{padding:8px 12px;font-size:12.5px;}
.btn-danger{background:transparent;color:var(--wine);border:1.5px solid var(--wine);}
.btn-danger:hover{background:var(--wine);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:var(--teal-deep);}

/* ---------- Dashboard grid ---------- */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.goal-card{
  background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border);border-top:4px solid var(--gold);
  padding:20px;cursor:pointer;
  transition: transform .15s ease, border-color .15s ease;
  display:flex;flex-direction:column;gap:14px;
}
.goal-card:hover{transform:translateY(-2px);border-top-color:var(--teal);}
.goal-card-top{display:flex;align-items:center;gap:12px;}
.goal-icon{
  width:44px;height:44px;border-radius:10px;background:var(--bg-card-alt);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.goal-card-title{font-weight:800;font-size:16px;color:var(--text-primary);line-height:1.25;}
.goal-card-cat{font-size:11.5px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.goal-card-mid{display:flex;align-items:center;gap:16px;}
.ring-wrap{position:relative;width:76px;height:76px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--text-primary);
}
.goal-card-stat{flex:1;min-width:0;}
.goal-card-stat .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:3px;}
.goal-card-stat .row b{color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-weight:700;}
.goal-card-flow{font-size:12px;color:var(--text-secondary);line-height:1.5;background:var(--bg-card-alt);padding:10px 12px;border-radius:8px;}
.goal-card-flow b{color:var(--teal-deep);}
:root[data-theme="dark"] .goal-card-flow b{color:var(--teal);}
.goal-card-actions{display:flex;gap:8px;justify-content:flex-end;}

.empty-state{
  text-align:center;padding:70px 20px;background:var(--bg-card);border-radius:var(--radius);
  border:1.5px dashed var(--border);box-shadow:var(--shadow);
}
.empty-state .cmp{width:64px;height:64px;margin:0 auto 18px;}
.empty-state h2{margin:0 0 8px;color:var(--text-primary);font-size:20px;}
.empty-state p{margin:0 0 22px;color:var(--text-secondary);font-size:14px;max-width:420px;margin-left:auto;margin-right:auto;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:var(--overlay-bg);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:var(--bg-card);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);border:1px solid var(--border);
}
.modal-sm{max-width:400px;}
.modal-header{
  padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--bg-card);z-index:2;
}
.modal-header h3{margin:0;font-size:17px;color:var(--text-primary);font-weight:800;}
.modal-body{padding:22px 26px;}
.modal-footer{padding:18px 26px 24px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-primary);margin-bottom:6px;letter-spacing:0.2px;}
.field .hint{font-size:11px;color:var(--text-secondary);margin-top:5px;line-height:1.5;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field input[type=password], .field textarea, .field select{
  width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--border);
  font-family:'Montserrat',sans-serif;font-size:13.5px;color:var(--text-primary);background:var(--bg-page);
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--gold-deep);}
.field textarea{resize:vertical;min-height:64px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.icon-picker{display:flex;flex-wrap:wrap;gap:8px;}
.icon-choice{
  width:40px;height:40px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-page);
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;
}
.icon-choice.active{border-color:var(--gold-deep);background:var(--bg-card-alt);}
.checkbox-row{display:flex;align-items:center;gap:9px;}
.checkbox-row input{width:16px;height:16px;}
.checkbox-row label{margin:0;font-size:13px;font-weight:600;color:var(--text-primary);}
.help-box{background:var(--bg-card-alt);border-radius:9px;padding:14px 16px;font-size:12px;color:var(--text-secondary);line-height:1.7;margin-bottom:16px;}
.help-box b{color:var(--text-primary);}
.help-box code{background:var(--bg-page);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;}

/* ---------- Detail view ---------- */
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.detail-title-wrap{display:flex;align-items:center;gap:12px;flex:1;min-width:200px;}
.detail-icon{width:48px;height:48px;border-radius:10px;background:var(--bg-card-alt);display:flex;align-items:center;justify-content:center;font-size:24px;}
.detail-title h2{margin:0;font-size:20px;color:var(--text-primary);font-weight:800;}
.detail-title span{font-size:12px;color:var(--text-secondary);font-weight:600;}
.tabs{display:flex;gap:4px;background:var(--bg-card-alt);padding:5px;border-radius:10px;margin-bottom:22px;flex-wrap:wrap;}
.tab-btn{
  flex:1;min-width:140px;text-align:center;padding:11px 14px;border-radius:7px;border:none;background:transparent;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:12.5px;color:var(--text-secondary);cursor:pointer;
  letter-spacing:0.3px;
}
.tab-btn.active{background:var(--bg-card);color:var(--text-primary);}

.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:22px;margin-bottom:18px;}
.card h4{margin:0 0 14px;font-size:14px;color:var(--text-primary);font-weight:800;letter-spacing:0.2px;display:flex;align-items:center;gap:8px;}
.flow-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
.flow-box{background:var(--bg-card-alt);border-radius:9px;padding:16px 18px;border:1px solid var(--border);}
.flow-box.now{border-left:4px solid var(--wine);}
.flow-box.want{border-left:4px solid var(--teal);}
.flow-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:800;color:var(--text-secondary);margin-bottom:6px;}
.flow-text{font-size:13.5px;color:var(--text-primary);line-height:1.5;}
.flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:22px;font-weight:800;}
.how-box{background:var(--bg-card-alt);border:1px solid var(--gold-deep);border-radius:9px;padding:16px 18px;margin-top:14px;}
.how-box .flow-label{color:var(--gold-deep);}
.how-box .flow-text{color:var(--text-primary);font-weight:600;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:16px;}
.stat-box{background:var(--bg-card-alt);border-radius:9px;padding:14px 16px;text-align:center;}
.stat-box.highlight{border:1.5px solid var(--gold-deep);}
.stat-box .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--text-primary);}
.stat-box .lbl{font-size:10.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-top:4px;}

.legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-secondary);margin-top:10px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block;}

/* ---------- Month / Week table ---------- */
.month-item{border:1px solid var(--border);border-radius:9px;margin-bottom:10px;overflow:hidden;background:var(--bg-page);}
.month-head{
  display:grid;grid-template-columns:26px 1.4fr 1fr 1fr 90px 22px;gap:10px;align-items:center;
  padding:12px 14px;cursor:pointer;background:var(--bg-card);
}
.month-head:hover{background:var(--bg-card-alt);}
.month-name{font-weight:700;font-size:13px;color:var(--text-primary);}
.month-head .mini-lbl{font-size:9.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.4px;font-weight:700;display:block;margin-bottom:2px;}
.editable-num{
  width:100%;border:1px solid transparent;background:transparent;font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:13px;color:var(--text-primary);padding:4px 6px;border-radius:6px;
}
.editable-num:hover{border-color:var(--border);}
.editable-num:focus{outline:none;border-color:var(--gold-deep);background:var(--bg-card);}
.prog-mini{height:6px;background:var(--bg-card-alt);border-radius:4px;overflow:hidden;}
.prog-mini > div{height:100%;background:var(--teal);}
.chevron{transition:transform .2s;color:var(--text-secondary);font-size:11px;}
.chevron.open{transform:rotate(90deg);}
.week-list{padding:6px 14px 14px 40px;background:var(--bg-card-alt);display:none;}
.week-list.open{display:block;}
.week-row{
  display:grid;grid-template-columns:1fr 1fr 1fr 90px;gap:10px;align-items:center;
  padding:9px 10px;font-size:12.5px;border-bottom:1px dashed var(--border);
}
.week-row:last-child{border-bottom:none;}
.week-row .wk-name{font-weight:600;color:var(--text-primary);}

/* ---------- Daily checklist ---------- */
.day-controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.day-controls select{padding:9px 12px;border-radius:8px;border:1.5px solid var(--border);font-family:'Montserrat',sans-serif;font-weight:600;font-size:13px;background:var(--bg-page);color:var(--text-primary);}
.week-block{margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg-page);}
.week-block-head{
  display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
  background:var(--bg-card-alt);color:var(--text-primary);border-bottom:1px solid var(--border);
}
.week-block-head b{font-size:13px;}
.week-block-head span{font-size:11.5px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:14px 16px;}
.day-cell{
  border:1.5px solid var(--border);border-radius:9px;padding:10px 6px;text-align:center;cursor:pointer;
  background:var(--bg-card);position:relative;
}
.day-cell:hover{border-color:var(--gold-deep);}
.day-cell.done{background:var(--bg-card-alt);border-color:var(--teal);}
.day-cell.today{border-color:var(--gold-deep);border-style:dashed;border-width:2px;}
.day-cell .today-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold-deep);color:#fff;font-size:8px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:0.3px;}
.day-cell .d-num{font-size:10px;color:var(--text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.day-cell .d-check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);margin:7px auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:var(--bg-page);
}
.day-cell.done .d-check{background:var(--teal);border-color:var(--teal);}
.day-cell .d-target{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-secondary);}
.day-cell.done .d-target{color:var(--teal-deep);font-weight:700;}
:root[data-theme="dark"] .day-cell.done .d-target{color:var(--teal);}
.day-cell .d-actual-edit{
  width:90%;margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10px;text-align:center;
  border:1px solid var(--border);border-radius:5px;padding:2px 3px;background:var(--bg-page);color:var(--text-primary);
}

/* ---------- Today highlight card ---------- */
.today-card{border:1.5px solid var(--gold-deep);background:var(--bg-card-alt);}
.today-card .num{color:var(--gold-deep);}

/* ---------- responsive ---------- */
@media (max-width:640px){
  .flow-pair{grid-template-columns:1fr;}
  .flow-arrow{transform:rotate(90deg);padding:4px 0;}
  .row2{grid-template-columns:1fr;}
  .month-head{grid-template-columns:20px 1fr 1fr;grid-template-rows:auto auto;}
  .month-head .prog-mini-cell{grid-column:1/-1;}
  .week-row{grid-template-columns:1fr 1fr;row-gap:4px;}
  .day-grid{grid-template-columns:repeat(4,1fr);}
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-primary);color:var(--bg-page);padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);opacity:0;pointer-events:none;transition:all .25s;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;color:var(--text-secondary);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FORMULA SUKSES — HABIT TRACKER
   ============================================================ */

const ICONS = ['💻','🕋','💰','📚','🏠','💪','🚗','✈️','🎓','🧘','🌱','👨‍👩‍👧‍👦','⛰️','⭐','🎯'];
const UNITS = ['Rp','kg','halaman','buku','jam','kali','langkah','custom'];
const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let state = {
  goals: [], view: 'dashboard', activeGoalId: null, detailTab: 'ringkasan', modal: null, editingGoal: null,
  theme: 'light',
  settings: { botToken:'', chatId:'', reminderTime:'07:00', enabled:false, lastSentDate:null }
};
let saveGoalsTimer = null, saveSettingsTimer = null, reminderInterval = null;

/* ---------------- storage ---------------- */
async function loadAll(){
  try{
    const g = await window.storage.get('formulaSukses_goals');
    if(g && g.value) state.goals = JSON.parse(g.value);
  }catch(e){ state.goals = []; }
  try{
    const s = await window.storage.get('formulaSukses_settings');
    if(s && s.value) state.settings = Object.assign(state.settings, JSON.parse(s.value));
  }catch(e){ /* keep defaults */ }
  try{
    const t = await window.storage.get('formulaSukses_theme');
    if(t && t.value) state.theme = t.value;
  }catch(e){ /* keep default */ }
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
  startReminderClock();
}
function saveGoals(){
  clearTimeout(saveGoalsTimer);
  saveGoalsTimer = setTimeout(async ()=>{
    try{ await window.storage.set('formulaSukses_goals', JSON.stringify(state.goals)); }
    catch(e){ showToast('Gagal menyimpan data'); }
  }, 250);
}
function saveSettings(){
  clearTimeout(saveSettingsTimer);
  saveSettingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set('formulaSukses_settings', JSON.stringify(state.settings)); }
    catch(e){ showToast('Gagal menyimpan pengaturan'); }
  }, 200);
}
async function saveTheme(){
  try{ await window.storage.set('formulaSukses_theme', state.theme); }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- theme ---------------- */
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  saveTheme(); render();
}

/* ---------------- helpers ---------------- */
function uid(){ return 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function roundSensible(val, unit){
  if(!isFinite(val)) return 0;
  if(unit === 'Rp'){ return Math.ceil(val/1000)*1000; }
  if(['halaman','buku','kali','langkah'].includes(unit)){ return Math.ceil(val); }
  return Math.round(val*10)/10;
}
function fmtNum(n, unit){
  if(n===null||n===undefined||isNaN(n)) n=0;
  const num = unit==='Rp' ? Math.round(n).toLocaleString('id-ID') : (Math.round(n*10)/10).toLocaleString('id-ID');
  return unit==='Rp' ? ('Rp ' + num) : (num + (unit && unit!=='custom' ? ' '+unit : ''));
}
function fmtCompact(v,unit){
  if(unit==='Rp'){
    if(v>=1000000) return (v/1000000).toFixed(1)+'jt';
    if(v>=1000) return Math.round(v/1000)+'rb';
    return Math.round(v).toString();
  }
  return (Math.round(v*10)/10).toString();
}

function buildDefaultMonths(currentValue, targetValue){
  const remaining = Math.max(targetValue - currentValue, 0);
  const perMonth = remaining/12;
  const months = [];
  for(let m=0;m<12;m++){
    const weeks = [];
    const perWeek = perMonth/4;
    for(let w=0;w<4;w++){
      const days = [];
      for(let d=0;d<7;d++){ days.push({ checked:false, actual:null }); }
      weeks.push({ target: perWeek, days });
    }
    months.push({ target: perMonth, weeks });
  }
  return months;
}

function goalUnit(g){ return g.unit === 'custom' ? (g.unitCustom||'') : g.unit; }
function dayTarget(week){ return week.target/7; }

function sumActualForWeek(week, unit){
  let sum=0;
  week.days.forEach(d=>{
    if(d.checked){ sum += (d.actual!==null && d.actual!==undefined) ? d.actual : roundSensible(dayTarget(week), unit); }
  });
  return sum;
}
function sumActualForMonth(month, unit){ return month.weeks.reduce((s,w)=>s+sumActualForWeek(w,unit),0); }
function sumActualTotal(goal){ const unit = goalUnit(goal); return goal.months.reduce((s,m)=>s+sumActualForMonth(m,unit),0); }
function sumTargetUpToMonth(goal, idx){ let s=0; for(let i=0;i<=idx;i++){ s+=goal.months[i].target; } return s; }
function sumActualUpToMonth(goal, idx){ const unit = goalUnit(goal); let s=0; for(let i=0;i<=idx;i++){ s+=sumActualForMonth(goal.months[i],unit); } return s; }

function goalProgress(goal){
  const achieved = goal.currentValue + sumActualTotal(goal);
  const pct = goal.targetValue>0 ? Math.min(100, Math.round((achieved/goal.targetValue)*100)) : 0;
  return { achieved, pct };
}

/* today-cell mapping: approximate 28-day months (4 weeks x 7 days), consistent with the plan's own structure */
function getTodayCell(goal){
  if(!goal.startDate) return null;
  const start = new Date(goal.startDate+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const daysSince = Math.floor((now-start)/86400000);
  if(daysSince < 0 || daysSince >= 12*28) return null;
  const mi = Math.floor(daysSince/28);
  const rem = daysSince % 28;
  const wi = Math.floor(rem/7);
  const di = rem % 7;
  return { mi, wi, di };
}

function renderChart(g, unit){
  const W=680,H=220,PAD=36;
  const targetPts = [], actualPts=[];
  for(let i=0;i<12;i++){
    targetPts.push(g.currentValue + sumTargetUpToMonth(g,i));
    actualPts.push(g.currentValue + sumActualUpToMonth(g,i));
  }
  const maxVal = Math.max(g.targetValue, ...targetPts, ...actualPts, 1);
  const x = i => PAD + (i/11)*(W-PAD*2);
  const y = v => H-PAD - (v/maxVal)*(H-PAD*2);
  const pathFor = pts => pts.map((v,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const gridColor = state.theme==='dark' ? '#243654' : '#EBE1C8';
  const textColor = state.theme==='dark' ? '#9BA6BF' : '#5B5F6B';
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const yy = H-PAD-f*(H-PAD*2);
    return `<line x1="${PAD}" y1="${yy}" x2="${W-PAD}" y2="${yy}" stroke="${gridColor}" stroke-width="1"/>
    <text x="4" y="${yy+3}" font-size="9" fill="${textColor}" font-family="JetBrains Mono">${fmtCompact(maxVal*f, unit)}</text>`;
  }).join('');
  const monthTicks = [0,2,4,6,8,10].map(i=>`<text x="${x(i)}" y="${H-PAD+16}" font-size="9" fill="${textColor}" text-anchor="middle" font-family="Montserrat">${MONTH_NAMES[i].slice(0,3)}</text>`).join('');
  return `<div style="overflow-x:auto;"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:${W}px;">
    ${gridLines}
    <path d="${pathFor(targetPts)}" fill="none" stroke="#A67C2E" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="${pathFor(actualPts)}" fill="none" stroke="#4C7B72" stroke-width="2.5"/>
    ${actualPts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#4C7B72"/>`).join('')}
    ${monthTicks}
  </svg></div>`;
}

function renderMonthRow(g,m,mi,unit){

      </div>
      <div class="prog-mini prog-mini-cell"><div style="width:${pct}%"></div></div>

  </div>`;
}
function round2(n){ return Math.round(n*100)/100; }

function renderWeekRow(g,w,mi,wi,unit){
  const actual = sumActualForWeek(w,unit);
  const pct = w.target>0 ? Math.min(100,Math.round((actual/w.target)*100)) : 0;
  return `
  <div class="week-row">
    <div class="wk-name">Pekan ${wi+1}</div>
    <div><span class="mini-lbl">Target</span><input class="editable-num" type="number" value="${round2(w.target)}" data-action="set-week-target" data-id="${g.id}" data-mi="${mi}" data-wi="${wi}"></div>
    <div><span class="mini-lbl">Realisasi</span> ${fmtNum(actual,unit)} <span style="color:var(--text-secondary)">(${pct}%)</span></div>
    <div class="prog-mini"><div style="width:${pct}%"></div></div>
  </div>`;
}

function renderHarian(g, unit){
  const selMonth = g._selMonth ?? 0;
  const m = g.months[selMonth];

  return `

function renderWeekBlock(g,w,mi,wi,unit,todayCell){
  const dTarget = roundSensible(dayTarget(w), unit);
  const actual = sumActualForWeek(w,unit);
  return `
  <div class="week-block">

      <b>Pekan ${wi+1}</b>

    <div class="day-grid">
      ${w.days.map((d,di)=>renderDayCell(g,d,mi,wi,di,dTarget,unit,todayCell)).join('')}

  </div>`;

function renderDayCell(g,d,mi,wi,di,dTarget,unit,todayCell){
  const val = d.actual!==null && d.actual!==undefined ? d.actual : dTarget;
  const isToday = todayCell && todayCell.mi===mi && todayCell.wi===wi && todayCell.di===di;
  return `

}

          </div>
        </div>
        <div class="hint">⚠️ Reminder otomatis hanya terkirim saat tab/halaman ini masih terbuka di browser — ini bukan notifikasi push server. Untuk memastikan bot bekerja, coba tombol "Kirim Tes Sekarang" di bawah.</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-action="close-modal">Tutup</button>
        <button class="btn btn-teal" data-action="test-reminder">📤 Kirim Tes Sekarang</button>
        <button class="btn btn-primary" data-action="save-settings">Simpan Pengaturan</button>
      </div>
    </div>
  </div>`;
}

function composeReminderMessage(){
  const today = new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  let lines = [`📋 <b>Reminder Formula Sukses</b>`, today, ''];
  if(state.goals.length===0){ lines.push('Belum ada target yang dibuat.'); }
  else{
    let any=false;
    state.goals.forEach(g=>{
      const cell = getTodayCell(g);
      if(!cell){ return; }
      any = true;
      const w = g.months[cell.mi].weeks[cell.wi];
      const dt = roundSensible(dayTarget(w), goalUnit(g));
      lines.push(`${g.icon} <b>${escapeForTelegram(g.title)}</b> — ${fmtNum(dt, goalUnit(g))} hari ini (Pekan ${cell.wi+1}, ${MONTH_NAMES[cell.mi]})`);
    });
    if(!any) lines.push('Semua target belum dimulai atau sudah melewati rencana 12 bulan.');
  }
  lines.push('', 'Ayo centang progres hari ini di aplikasi 💪');
  return lines.join('\n');
}
function escapeForTelegram(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function sendTelegramMessage(text){
  const { botToken, chatId } = state.settings;
  if(!botToken || !chatId){ showToast('Isi Bot Token & Chat ID dulu'); return false; }
  try{
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: chatId, text, parse_mode:'HTML' })
    });
    const data = await res.json();
    if(data.ok){ showToast('Reminder terkirim ke Telegram ✅'); return true; }
    showToast('Gagal kirim: ' + (data.description || 'cek token/chat id'));
    return false;
  }catch(e){
    showToast('Gagal kirim: koneksi bermasalah');
    return false;
  }
}

function startReminderClock(){
  if(reminderInterval) clearInterval(reminderInterval);
  reminderInterval = setInterval(checkReminderTime, 20000);
  checkReminderTime();
}
async function checkReminderTime(){
  const s = state.settings;
  if(!s.enabled || !s.botToken || !s.chatId) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const todayStr = now.toISOString().slice(0,10);
  if(hhmm === s.reminderTime && s.lastSentDate !== todayStr){
    const ok = await sendTelegramMessage(composeReminderMessage());
    if(ok){ s.lastSentDate = todayStr; saveSettings(); }
  }
}

/* ---------------- events ---------------- */
function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-action]')) return;
      state.activeGoalId = el.getAttribute('data-open');
      state.view='detail'; state.detailTab='ringkasan';
      render();
    });
  });

  app.querySelectorAll('[data-action="back-dashboard"]').forEach(el=>el.addEventListener('click',()=>{
    state.view='dashboard'; render();
  }));
  app.querySelectorAll('[data-action="toggle-theme"]').forEach(el=>el.addEventListener('click', toggleTheme));
  app.querySelectorAll('[data-action="open-settings"]').forEach(el=>el.addEventListener('click',()=>{
    state.modal='settings'; render();
  }));

  app.querySelectorAll('[data-action="new-goal"]').forEach(el=>el.addEventListener('click',()=>{
    state.editingGoal=null; state.modal='goal'; render();
  }));
  app.querySelectorAll('[data-action="edit-goal"]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    state.editingGoal = getGoal(el.getAttribute('data-id')); state.modal='goal'; render();
  }));
  app.querySelectorAll('[data-action="delete-goal"]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    state._deleteId = el.getAttribute('data-id'); state.modal='delete-confirm'; render();
  }));
  app.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.addEventListener('click',()=>{
    state.modal=null; state.editingGoal=null; render();
  }));
  app.querySelectorAll('[data-action="confirm-delete"]').forEach(el=>el.addEventListener('click',()=>{
    state.goals = state.goals.filter(g=>g.id!==state._deleteId);
    if(state.activeGoalId===state._deleteId){ state.view='dashboard'; state.activeGoalId=null; }
    state.modal=null; saveGoals(); showToast('Target dihapus'); render();
  }));

  app.querySelectorAll('#icon-picker .icon-choice').forEach(el=>el.addEventListener('click',()=>{
    app.querySelectorAll('#icon-picker .icon-choice').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
  }));
  const unitSel = document.getElementById('f-unit');
  if(unitSel){
    unitSel.addEventListener('change', ()=>{
      document.getElementById('f-unit-custom-wrap').style.display = unitSel.value==='custom' ? '' : 'none';
    });
  }
  app.querySelectorAll('[data-action="save-goal"]').forEach(el=>el.addEventListener('click',()=>{
    saveGoalFromForm(el.getAttribute('data-id'));
  }));

  app.querySelectorAll('[data-action="tab"]').forEach(el=>el.addEventListener('click',()=>{
    state.detailTab = el.getAttribute('data-tab'); render();
  }));

  app.querySelectorAll('[data-action="toggle-month"]').forEach(el=>el.addEventListener('click',()=>{
    const g = getGoal(el.getAttribute('data-id')); const mi = +el.getAttribute('data-mi');
    g._openMonth = (g._openMonth===mi) ? null : mi; render();
  }));
  app.querySelectorAll('[data-action="set-month-target"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const g = getGoal(el.getAttribute('data-id')); const mi = +el.getAttribute('data-mi');
      g.months[mi].target = parseFloat(el.value)||0; saveGoals(); render();
    });
  });
  app.querySelectorAll('[data-action="set-week-target"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const g = getGoal(el.getAttribute('data-id')); const mi=+el.getAttribute('data-mi'); const wi=+el.getAttribute('data-wi');
      g.months[mi].weeks[wi].target = parseFloat(el.value)||0; saveGoals(); render();
    });
  });
  app.querySelectorAll('[data-action="reset-auto"]').forEach(el=>el.addEventListener('click',()=>{
    const g = getGoal(el.getAttribute('data-id'));
    g.months = buildDefaultMonths(g.currentValue, g.targetValue);
    saveGoals(); showToast('Rencana direset ke pembagian otomatis'); render();
  }));

  app.querySelectorAll('[data-action="select-month"]').forEach(el=>el.addEventListener('change',()=>{
    const g = getGoal(el.getAttribute('data-id')); g._selMonth = +el.value; render();
  }));
  app.querySelectorAll('[data-action="goto-today"]').forEach(el=>el.addEventListener('click',()=>{
    const g = getGoal(el.getAttribute('data-id')); const cell = getTodayCell(g);
    if(cell){ g._selMonth = cell.mi; render(); }
  }));

  app.querySelectorAll('[data-action="toggle-day"]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-action="set-day-actual"]')) return;
    const g = getGoal(el.getAttribute('data-id'));
    const mi=+el.getAttribute('data-mi'), wi=+el.getAttribute('data-wi'), di=+el.getAttribute('data-di');
    const day = g.months[mi].weeks[wi].days[di];
    day.checked = !day.checked;
    if(day.checked && (day.actual===null||day.actual===undefined)){
      day.actual = roundSensible(dayTarget(g.months[mi].weeks[wi]), goalUnit(g));
    }
    saveGoals(); render();
  }));
  app.querySelectorAll('[data-action="set-day-actual"]').forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
    el.addEventListener('change', ()=>{
      const g = getGoal(el.getAttribute('data-id'));
      const mi=+el.getAttribute('data-mi'), wi=+el.getAttribute('data-wi'), di=+el.getAttribute('data-di');
      g.months[mi].weeks[wi].days[di].actual = parseFloat(el.value)||0;
      saveGoals(); render();
    });
  });

  app.querySelectorAll('[data-action="save-settings"]').forEach(el=>el.addEventListener('click',()=>{
    state.settings.botToken = document.getElementById('s-token').value.trim();
    state.settings.chatId = document.getElementById('s-chatid').value.trim();
    state.settings.reminderTime = document.getElementById('s-time').value || '07:00';
    state.settings.enabled = document.getElementById('s-enabled').checked;
    saveSettings();
    state.modal=null; showToast('Pengaturan reminder disimpan'); render();
  }));
  app.querySelectorAll('[data-action="test-reminder"]').forEach(el=>el.addEventListener('click',()=>{
    const token = document.getElementById('s-token').value.trim();
    const chatId = document.getElementById('s-chatid').value.trim();
    state.settings.botToken = token; state.settings.chatId = chatId;
    sendTelegramMessage(composeReminderMessage());
  }));
}

function saveGoalFromForm(existingId){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ showToast('Nama target wajib diisi'); return; }
  const icon = document.querySelector('#icon-picker .icon-choice.active')?.getAttribute('data-icon') || '🎯';
  const unit = document.getElementById('f-unit').value;
  const unitCustom = document.getElementById('f-unit-custom')?.value.trim() || '';
  const currentValue = parseFloat(document.getElementById('f-current').value)||0;
  const targetValue = parseFloat(document.getElementById('f-target').value)||0;
  const startDate = document.getElementById('f-start').value;
  const kondisiSekarang = document.getElementById('f-now').value.trim();
  const kondisiDiinginkan = document.getElementById('f-want').value.trim();
  const how = document.getElementById('f-how').value.trim();

  if(existingId){
    const g = getGoal(existingId);
    const valueChanged = g.currentValue!==currentValue || g.targetValue!==targetValue;
    Object.assign(g, { title, icon, unit, unitCustom, currentValue, targetValue, startDate, kondisiSekarang, kondisiDiinginkan, how });
    if(valueChanged){ g.months = buildDefaultMonths(currentValue,targetValue); }
    showToast('Target diperbarui');
  } else {
    const g = {
      id: uid(), title, icon, unit, unitCustom, currentValue, targetValue, startDate,
      kondisiSekarang, kondisiDiinginkan, how,
      months: buildDefaultMonths(currentValue,targetValue),
      _openMonth: null, _selMonth: 0
    };
    state.goals.push(g);
    showToast('Target baru dibuat 🎯');
  }
  state.modal=null; state.editingGoal=null;
  saveGoals(); render();
}

/* ---------------- init ---------------- */
document.getElementById('app').innerHTML = `<div class="loading-screen"><div class="brand-mark" style="width:56px;height:56px;"></div><p>Memuat data target...</p></div>`;
loadAll();
</script>
